apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-c-staging
  namespace: exam-3
  labels:
    app: portal-c
    env: staging
spec:
  replicas: 2
  # only manage pods matching these exact labels
  selector:
    matchLabels:
      app: portal-c
      env: staging
  template:
    metadata:
      labels:
        app: portal-c
        env: staging
    spec:
      # lets the pod pull from the private registry
      imagePullSecrets:
        - name: registry-cred
      containers:
        - name: portal-c
          # Jenkins overwrites this line with the real tag it built
          image: 192.168.10.23:5000/portal-c:staging-d641415
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: staging
            # pulled from the Secret we created, not typed here
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: portal-c-secret
                  key: API_KEY
          # liveness: is the process alive
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          # readiness: can it actually serve traffic right now
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
